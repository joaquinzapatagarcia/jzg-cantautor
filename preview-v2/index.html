<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090705">
  <meta name="description" content="Concierto de bolsillo de JZG Cantautor. Ocho canciones y una baraja de versos para cuando la vida aprieta.">
  <title>Concierto de bolsillo — JZG Cantautor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f3eadf;--muted:#b7aa99;--amber:#d29148;--line:rgba(243,234,223,.2);--shade:rgba(7,5,4,.78);--progress:0%}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#090705;color:var(--paper);font-family:"IBM Plex Mono",monospace;overflow:hidden}
    button{font:inherit;color:inherit}.stage,.backdrop,.backdrop::after,.grain{position:fixed;inset:0}.stage{isolation:isolate;min-height:100svh;padding:max(22px,env(safe-area-inset-top)) clamp(20px,4vw,58px) max(20px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;z-index:1}
    .backdrop{z-index:-3;background:url("../assets/atmosfera/imagenjzg3.png") center 35%/cover no-repeat;transition:opacity .8s ease,background-image 1.2s ease;animation:breathe 26s ease-in-out infinite alternate}
    .backdrop::after{content:"";background:radial-gradient(circle at 50% 45%,rgba(20,13,8,.08),rgba(5,4,3,.84) 75%),linear-gradient(90deg,rgba(5,4,3,.68),rgba(5,4,3,.2) 52%,rgba(5,4,3,.67));position:absolute;inset:0}
    .grain{z-index:8;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.035)}}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;text-transform:uppercase;font-size:10px;letter-spacing:.18em;color:var(--muted);z-index:3}.brand strong{display:block;color:var(--paper);font-weight:400;font-size:12px;margin-bottom:7px}.status{text-align:right;line-height:1.7}.signal{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);margin-right:8px}
    .reading{width:min(980px,92vw);margin:auto;text-align:center;align-self:center;transition:opacity .38s ease,transform .38s ease;z-index:2}.reading.changing{opacity:0;transform:translateY(8px)}.verse{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(34px,5.4vw,76px);font-weight:400;line-height:.98;letter-spacing:-.018em;white-space:pre-line;text-wrap:balance;text-shadow:0 3px 32px rgba(0,0,0,.55);margin:0}.source{margin-top:clamp(24px,4vh,42px);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#d8ad7c}.counter{color:var(--muted);margin-left:12px}
    .controls{z-index:4;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:22px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons.right{justify-content:flex-end}.control{border:1px solid var(--line);background:rgba(8,6,4,.38);backdrop-filter:blur(10px);border-radius:2px;padding:11px 14px;text-transform:uppercase;letter-spacing:.13em;font-size:9px;cursor:pointer;transition:.22s}.control:hover,.control.active{border-color:rgba(210,145,72,.7);background:rgba(210,145,72,.15);color:#f4d0a7}.control.primary{background:var(--paper);color:#17110c;border-color:var(--paper)}.control.primary:hover{background:#e2b77f;border-color:#e2b77f}.edition{text-align:center;font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;padding-bottom:3px}
    .player{position:fixed;inset:auto 0 0;z-index:12;background:rgba(8,6,4,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:22px clamp(20px,4vw,58px) max(20px,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}.player.open{transform:translateY(0)}.player-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}.now small{display:block;color:var(--amber);font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:7px}.now strong{font-family:"Instrument Serif",serif;font-size:clamp(25px,3vw,38px);font-weight:400}.close{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}.transport{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:13px;align-items:center;margin:20px 0}.round{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer}.round.play{background:var(--paper);color:#17110c}.timeline{height:2px;background:var(--line);cursor:pointer;position:relative;margin-left:8px}.timeline::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--progress);background:var(--amber)}.time{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}.tracks{display:flex;gap:8px;overflow-x:auto;padding:0 0 5px;scrollbar-width:none}.track{flex:0 0 auto;border:1px solid var(--line);background:transparent;padding:9px 11px;color:var(--muted);font-size:9px;cursor:pointer}.track.active{color:var(--paper);border-color:var(--amber)}
    body.focus header,body.focus .controls{opacity:0;pointer-events:none;transition:opacity .35s}.focus-exit{position:fixed;right:18px;top:18px;z-index:15;display:none}body.focus .focus-exit{display:block}
    @media(max-width:700px){.stage{padding:20px 18px 18px}.backdrop{background-position:center 28%}.backdrop::after{background:linear-gradient(0deg,rgba(5,4,3,.87),rgba(5,4,3,.36) 62%,rgba(5,4,3,.58))}.status span:last-child{display:none}.reading{width:94vw;padding:0 4px}.verse{font-size:clamp(36px,10.5vw,54px);line-height:.98}.controls{grid-template-columns:1fr auto}.edition{display:none}.buttons.right{justify-content:flex-end}.control{padding:11px 12px}.player{padding:19px 17px max(17px,env(safe-area-inset-bottom))}.transport{grid-template-columns:auto auto auto 1fr;gap:9px}.time{display:none}.now strong{font-size:27px}}
    @media(max-width:420px){header{font-size:8px}.brand strong{font-size:10px}.verse{font-size:clamp(33px,10vw,44px)}.controls{gap:8px}.buttons{gap:5px}.control{font-size:8px;padding:10px 9px}.source{font-size:8px}}
    @media(prefers-reduced-motion:reduce){.backdrop{animation:none}.reading,.player{transition:none}}
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div><div class="grain"></div>
  <main class="stage">
    <header><div class="brand"><strong>Concierto de bolsillo</strong>Canciones para cuando la vida aprieta</div><div class="status"><span class="signal"></span><span>JZG Cantautor · 8 canciones</span></div></header>
    <section class="reading" id="reading" aria-live="polite"><blockquote class="verse" id="verse"></blockquote><div class="source"><span id="source"></span><span class="counter" id="counter"></span></div></section>
    <footer class="controls">
      <div class="buttons"><button class="control primary" id="next">Otra</button><button class="control" id="auto">Auto</button></div>
      <div class="edition">Todavía canto yo · 2026</div>
      <div class="buttons right"><button class="control" id="focus">Foco</button><button class="control" id="listen">Escuchar</button></div>
    </footer>
  </main>
  <button class="control focus-exit" id="focusExit">Salir de foco</button>
  <aside class="player" id="player" aria-hidden="true">
    <div class="player-top"><div class="now"><small>Ahora suena · <span id="trackNumber">01 / 08</span></small><strong id="nowTitle"></strong></div><button class="close" id="close" aria-label="Cerrar reproductor">×</button></div>
    <div class="transport"><button class="round" id="prev" aria-label="Anterior">‹</button><button class="round play" id="play" aria-label="Reproducir">▶</button><button class="round" id="forward" aria-label="Siguiente">›</button><div class="timeline" id="timeline"></div><span class="time"><span id="current">0:00</span> / <span id="total">—:—</span></span></div>
    <div class="tracks" id="tracks"></div><audio id="audio" preload="metadata"></audio>
  </aside>
  <script>
    const songs=[
      ['No me quites el pan, algoritmo','../audio/01-no-me-quites-el-pan-algoritmo.mp3'],['Ser pesimista sale gratis','../audio/02-ser-pesimista-sale-gratis.mp3'],['El mayor invento del siglo','../audio/03-el-mayor-invento-del-siglo.mp3'],['Los que aún creemos','../audio/04-los-que-aun-creemos.mp3'],['Terminar es traicionar','../audio/05-terminar-es-traicionar.mp3'],['En mi hambre mando yo','../audio/06-en-mi-hambre-mando-yo.mp3'],['Fuera de cobertura','../audio/07-fuera-de-cobertura.mp3'],['Brindaremos con coñac','../audio/08-brindaremos-con-conac.mp3']
    ];
    const images=['../assets/atmosfera/imagenjzg1.png','../assets/atmosfera/imagenjzg2.png','../assets/atmosfera/imagenjzg3.png'];
    const $=s=>document.querySelector(s),audio=$('#audio'),reading=$('#reading'),player=$('#player'),backdrop=$('#backdrop');let cards=[],deck=[],position=0,autoTimer=null,activeTrack=0;
    const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    function resetDeck(){deck=shuffle([...cards.keys()]);position=0}
    function showCard(initial=false){if(!deck.length||position>=deck.length)resetDeck();const card=cards[deck[position++]];const apply=()=>{$('#verse').textContent=card.text;$('#source').textContent=card.title;$('#counter').textContent=`${String(position).padStart(2,'0')} / ${cards.length}`;const image=images[(card.song-1)%images.length];backdrop.style.backgroundImage=`url("${image}")`;reading.classList.remove('changing')};if(initial)apply();else{reading.classList.add('changing');setTimeout(apply,380)}}
    function toggleAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;$('#auto').classList.remove('active');$('#auto').textContent='Auto'}else{autoTimer=setInterval(showCard,11000);$('#auto').classList.add('active');$('#auto').textContent='Auto · On'}}
    const fmt=s=>Number.isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'—:—';
    function loadTrack(i,autoplay=false){activeTrack=(i+songs.length)%songs.length;audio.src=songs[activeTrack][1];$('#nowTitle').textContent=songs[activeTrack][0];$('#trackNumber').textContent=`${String(activeTrack+1).padStart(2,'0')} / 08`;document.querySelectorAll('.track').forEach((b,n)=>b.classList.toggle('active',n===activeTrack));if(autoplay)audio.play().catch(()=>{})}
    songs.forEach((s,i)=>{const b=document.createElement('button');b.className='track';b.textContent=`${String(i+1).padStart(2,'0')} · ${s[0]}`;b.onclick=()=>loadTrack(i,true);$('#tracks').append(b)});
    $('#next').onclick=()=>{showCard();if(autoTimer){clearInterval(autoTimer);autoTimer=setInterval(showCard,11000)}};$('#auto').onclick=toggleAuto;$('#focus').onclick=()=>document.body.classList.add('focus');$('#focusExit').onclick=()=>document.body.classList.remove('focus');
    $('#listen').onclick=()=>{player.classList.add('open');player.setAttribute('aria-hidden','false')};$('#close').onclick=()=>{player.classList.remove('open');player.setAttribute('aria-hidden','true')};$('#play').onclick=()=>audio.paused?audio.play():audio.pause();$('#prev').onclick=()=>loadTrack(activeTrack-1,true);$('#forward').onclick=()=>loadTrack(activeTrack+1,true);
    audio.onplay=()=>{$('#play').textContent='Ⅱ';$('#play').setAttribute('aria-label','Pausar')};audio.onpause=()=>{$('#play').textContent='▶';$('#play').setAttribute('aria-label','Reproducir')};audio.onended=()=>loadTrack(activeTrack+1,true);audio.onloadedmetadata=()=>$('#total').textContent=fmt(audio.duration);audio.ontimeupdate=()=>{$('#current').textContent=fmt(audio.currentTime);document.documentElement.style.setProperty('--progress',`${audio.currentTime/audio.duration*100||0}%`)};
    $('#timeline').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration};document.onkeydown=e=>{if(e.key==='ArrowRight')showCard();if(e.key==='Escape'){document.body.classList.remove('focus');player.classList.remove('open')}};
    fetch('data/frases.json').then(r=>r.json()).then(data=>{cards=data;resetDeck();showCard(true)}).catch(()=>{$('#verse').textContent='Todavía canto yo.';$('#source').textContent='JZG Cantautor'});loadTrack(0);
  </script>
</body>
</html>
